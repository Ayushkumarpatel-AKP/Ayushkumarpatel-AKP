<svg xmlns="http://www.w3.org/2000/svg" width="340" height="340" viewBox="0 0 360 360">
  <defs>
    <clipPath id="portraitClip">
      <circle cx="180" cy="180" r="150"/>
    </clipPath>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8142C"/>
      <stop offset="50%" stop-color="#ff5470"/>
      <stop offset="100%" stop-color="#7A0C16"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#E8142C" stop-opacity="0"/>
      <stop offset="100%" stop-color="#E8142C" stop-opacity="0.35"/>
    </radialGradient>
  </defs>

  <circle cx="180" cy="180" r="172" fill="url(#glow)">
    <animate attributeName="r" values="166;180;166" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <circle cx="180" cy="180" r="160" fill="none" stroke="url(#ringGrad)" stroke-width="5" stroke-linecap="round" stroke-dasharray="220 780" opacity="0.9">
    <animateTransform attributeName="transform" type="rotate" from="0 180 180" to="360 180 180" dur="6s" repeatCount="indefinite"/>
  </circle>

  <circle cx="180" cy="180" r="160" fill="none" stroke="url(#ringGrad)" stroke-width="2" stroke-dasharray="6 10" opacity="0.5">
    <animateTransform attributeName="transform" type="rotate" from="360 180 180" to="0 180 180" dur="10s" repeatCount="indefinite"/>
  </circle>

  <circle cx="180" cy="180" r="152" fill="#0a0707"/>
  <image href="https://raw.githubusercontent.com/Ayushkumarpatel-AKP/Ayushkumarpatel-AKP/main/assets/portrait.png" x="30" y="30" width="300" height="300" clip-path="url(#portraitClip)" preserveAspectRatio="xMidYMid slice"/>
  <circle cx="180" cy="180" r="150" fill="none" stroke="#1a1010" stroke-width="3"/>
</svg>
